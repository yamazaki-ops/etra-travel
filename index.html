<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Etraトラベル</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2129" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Etraトラベル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 1カラム。ダッシュボード（年・月 → 出張一覧）と旅程画面の2画面。移動=青、宿泊=緑、時刻は等幅 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18222e; --muted:#5c6b7a; --line:#d5dce4;
  --move:#1f5fa8; --move-soft:#e3edf8; --stay:#2f7a55; --stay-soft:#e2f1e8; --warn:#a8561f; --past:#9aa5b1;
  --scrim:rgba(17,24,32,.55);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#93a1b0; --line:#2c3642;
  --move:#7fb0e8; --move-soft:#1c2c3f; --stay:#7cc79f; --stay-soft:#1b3127; --warn:#e3a06e; --past:#5d6874;
  --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e6ebf0; --muted:#93a1b0; --line:#2c3642;
  --move:#7fb0e8; --move-soft:#1c2c3f; --stay:#7cc79f; --stay-soft:#1b3127; --warn:#e3a06e; --past:#5d6874;
  --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}

/* アプリバー */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:52px}
.brand{font-weight:700;font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--move)}
.clock{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.clock b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.back{font:inherit;font-size:14px;border:0;background:none;color:var(--move);padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:2px}
.back:focus-visible,.btn:focus-visible,.card:focus-visible,.trip:focus-visible,.mon:focus-visible,select:focus-visible{outline:2px solid var(--move);outline-offset:2px}

main{padding-block:16px 56px}
main .wrap{display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sample{font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:2px 8px;align-self:flex-start}

/* ダッシュボード */
.picker{display:flex;flex-direction:column;gap:10px}
.yearrow{display:flex;align-items:center;gap:10px}
.yearrow label{font-size:13px;color:var(--muted)}
select{font:inherit;font-family:var(--f-num);font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mon{font:inherit;font-family:var(--f-num);font-size:14px;padding:8px 0 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.mon i{width:5px;height:5px;border-radius:50%;background:transparent}
.mon.has i{background:var(--move)}
.mon.sel{background:var(--move);color:var(--surface);border-color:var(--move)}
.mon.sel.has i{background:var(--surface)}
.mon.cur{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.trips{display:flex;flex-direction:column;gap:10px}
.trip{font:inherit;text-align:left;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.trip .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trip .t{font-weight:700;font-size:16px;min-width:0;text-wrap:balance}
.trip .d{font-size:13px;color:var(--muted)}
.trip .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.trip .go{color:var(--move);font-size:13px;font-weight:700}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.chip.future{background:var(--move-soft);color:var(--move)}
.chip.now{background:var(--move);color:var(--surface)}
.chip.past{background:var(--line);color:var(--muted)}
.trip.past{opacity:.6}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}

/* 旅程画面 */
.head h1{font-size:21px;margin:0;text-wrap:balance}
.head .range{color:var(--muted);font-size:13px}
.day{display:flex;flex-direction:column;gap:8px}
.day h2{font-size:14px;margin:8px 0 0;display:flex;gap:8px;align-items:baseline}
.day h2 .num{font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:56px 1fr;gap:4px 12px;cursor:pointer;position:relative}
.card .time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.card .time small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.card .main{min-width:0;display:flex;flex-direction:column;gap:6px}
.kind{font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px}
.move .kind{background:var(--move-soft);color:var(--move)}
.stay .kind{background:var(--stay-soft);color:var(--stay)}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.soon{font-size:11px;font-weight:700;color:var(--move)}
.stay .soon{color:var(--stay)}
.card .title{font-weight:700;font-size:15px}
.sub{font-size:13px;color:var(--muted);text-wrap:pretty}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.map{color:var(--move);border-color:color-mix(in srgb,var(--move) 40%,var(--line))}
.stay .btn.map{color:var(--stay);border-color:color-mix(in srgb,var(--stay) 40%,var(--line))}
.btn svg{width:14px;height:14px;flex:none}

/* 状態 */
.card.past{filter:grayscale(1);opacity:.45}
.card.past .btn.map,.card.past .kind{color:var(--past)}
.card.now.move{border-color:var(--move);box-shadow:0 0 0 1px var(--move)}
.card.now.stay{border-color:var(--stay);box-shadow:0 0 0 1px var(--stay)}
.card.pulse.move{--glow:var(--move-soft)}
.card.pulse.stay{--glow:var(--stay-soft)}
@media (prefers-reduced-motion:no-preference){
  .card.pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{background:var(--surface)}50%{background:var(--glow)}}
}
@media (prefers-reduced-motion:reduce){.card.pulse{background:var(--glow)}}

/* 拡大表示 */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .panel{background:var(--surface);border-radius:12px;width:100%;max-width:520px;max-height:100%;overflow:auto;display:flex;flex-direction:column}
.panel .bar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--surface)}
.panel.move .bar{background:var(--move)} .panel.stay .bar{background:var(--stay)}
.panel .close{font:inherit;font-size:13px;border:1px solid currentColor;background:none;color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer}
.panel .body{padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.route .t{font-size:34px;font-weight:600;line-height:1.1}
.route .p{font-size:14px;font-weight:700}
.route .p span,.card .title span,.panel .name span,.nw{display:inline-block}
.route .end{text-align:right}
.route .arrow{color:var(--muted);padding-bottom:6px}
.panel .name{font-size:18px;font-weight:700}
.panel dl.facts{font-size:15px;gap:6px 16px}
.panel .btn{font-size:14px;padding:9px 12px}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;max-width:calc(100% - 32px)}
.warn{font-size:12px;font-weight:700;color:var(--warn);border-left:3px solid var(--warn);padding:1px 0 1px 8px}
.warnbox{background:var(--surface);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.warnbox .label{color:var(--warn)}
.warnbox ul{margin:0;padding-left:1.2em;font-size:13px;display:flex;flex-direction:column;gap:2px;text-wrap:pretty}
.trip .meta .w{color:var(--warn);font-weight:700}
.route .t.none{font-size:16px;color:var(--muted);padding-bottom:6px}
.btn.ticket{background:var(--move);color:var(--surface);border-color:var(--move)}
.card.past .warn{color:var(--past);border-color:var(--past)}
footer{color:var(--muted);font-size:12px}
</style>

</head>
<body>
<header class="appbar gutter">
  <div class="wrap">
    <button class="back" id="back" hidden aria-label="ダッシュボードに戻る">‹ 一覧</button>
    <h1 class="brand"><span>Etra</span>トラベル</h1>
    <div class="clock" id="clock" aria-live="off"><b>--:--:--</b><span>--/--（-）</span></div>
  </div>
</header>

<main class="gutter">
  <div class="wrap" id="view-dash">
    <div class="sample" id="sample-note" hidden>サンプルデータで表示中です</div>
    <section class="picker" aria-label="表示する月">
      <div class="yearrow"><label for="year">年</label><select id="year"></select></div>
      <div class="months" id="months"></div>
    </section>
    <div class="label" id="list-label"></div>
    <div class="trips" id="trips"></div>
  </div>

  <div class="wrap" id="view-trip" hidden>
    <div class="head">
      <h1 id="trip-title"></h1>
      <div class="range num" id="trip-range"></div>
    </div>
    <div class="warnbox" id="trip-warn" hidden></div>
    <div id="days" class="day"></div>
    <footer>時刻・座席は予約時点の情報です。遅延・番線変更は未反映</footer>
  </div>
</main>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script>
const SAMPLE = window.SAMPLE, TRIPS = window.TRIPS;

const KIND = { flight:"飛行機", train:"鉄道", bus:"バス", hotel:"宿泊" };
const WD = ["日","月","火","水","木","金","土"];
const H = 3600e3, DAY = 864e5;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const at = (d,t) => new Date(`${d}T${t||"00:00"}:00+09:00`);
const jst = x => { const y = new Date((x instanceof Date ? x : at(x)).getTime()+9*H);
  return { Y:y.getUTCFullYear(), M:y.getUTCMonth()+1, D:y.getUTCDate(), w:WD[y.getUTCDay()], h:y.getUTCHours(), m:y.getUTCMinutes(), s:y.getUTCSeconds() }; };
const p2 = n => String(n).padStart(2,"0");
const md = d => { const j = jst(d); return `${j.M}/${j.D}（${j.w}）`; };
const seg = s => esc(s).split(" ").map(w=>`<span>${w}</span>`).join(" ");
const mapURL = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const PIN = `<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.2a4.8 4.8 0 0 0-4.8 4.8c0 3.6 4.8 8.8 4.8 8.8s4.8-5.2 4.8-8.8A4.8 4.8 0 0 0 8 1.2Zm0 6.6a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6Z"/></svg>`;

// 予定ごとの時刻を計算
TRIPS.forEach(t => {
  t.items = t.items.map((it,i) => {
    const hotel = it.type==="hotel";
    const start = hotel ? at(it.date, it.checkin) : at(it.date, it.dep.time);
    const end = hotel ? at(it.checkout.date, it.checkout.time || "10:00") : at(it.date, it.arr.time);
    // 点滅の開始：宿泊はチェックイン当日0:00、交通は出発1時間前
    const alert = hotel ? at(it.date, "00:00") : new Date(start - H);
    return { ...it, key:`${t.id}-${i}`, start, end, alert };
  }).sort((a,b) => a.start - b.start);
  t.start = t.items[0].start;
  t.end = t.items.reduce((m,x) => x.end > m ? x.end : m, t.items[0].end);
  t.firstDate = t.items[0].date;
  t.lastDate = jst(t.end); t.lastDate = `${t.lastDate.Y}-${p2(t.lastDate.M)}-${p2(t.lastDate.D)}`;
});
const byKey = {}; TRIPS.forEach(t => t.items.forEach(x => byKey[x.key] = x));

let now = new Date();
const st = x => now >= x.end ? "past" : now >= x.start ? "now" : "future";
const pulsing = x => now >= x.alert && now < x.end;

/* ---------- ダッシュボード ---------- */
const view = { y: jst(now).Y, m: jst(now).M };
const monthsWithTrips = y => {
  const set = new Set();
  TRIPS.forEach(t => { // 期間が掛かる月をすべて
    let d = at(t.firstDate), last = at(t.lastDate);
    while (d <= last){ const j = jst(d); if (j.Y===y) set.add(j.M); d = new Date(d.getTime()+DAY); }
  });
  return set;
};
function tripsIn(y,m){
  const a = at(`${y}-${p2(m)}-01`), b = m===12 ? at(`${y+1}-01-01`) : at(`${y}-${p2(m+1)}-01`);
  return TRIPS.filter(t => at(t.firstDate) < b && at(t.lastDate) >= a).sort((p,q) => p.start - q.start);
}
function renderYears(){
  const ys = new Set([jst(now).Y]); TRIPS.forEach(t => { ys.add(jst(t.start).Y); ys.add(jst(t.end).Y); });
  $("#year").innerHTML = [...ys].sort().map(y => `<option value="${y}"${y===view.y?" selected":""}>${y}年</option>`).join("");
}
function renderDash(){
  $("#sample-note").hidden = !SAMPLE;
  const has = monthsWithTrips(view.y), cur = jst(now);
  $("#months").innerHTML = Array.from({length:12},(_,i)=>i+1).map(m =>
    `<button class="mon${has.has(m)?" has":""}${m===view.m?" sel":""}${view.y===cur.Y&&m===cur.M?" cur":""}" data-m="${m}" aria-pressed="${m===view.m}" aria-label="${m}月${has.has(m)?"（出張あり）":""}">${m}月<i></i></button>`).join("");
  const list = tripsIn(view.y, view.m);
  $("#list-label").textContent = `${view.y}年${view.m}月の出張 ${list.length}件`;
  $("#trips").innerHTML = list.length ? list.map(t => {
    const s = now >= t.end ? "past" : now >= t.start ? "now" : "future";
    const chip = { past:"終了", now:"出張中", future: countdown(t.start) }[s];
    const moves = t.items.filter(x=>x.type!=="hotel").length;
    const nights = t.items.filter(x=>x.type==="hotel").reduce((n,x)=> n + Math.round((at(x.checkout.date)-at(x.date))/DAY), 0);
    const first = t.items.find(x=>x.type!=="hotel") || null;
    return `<button class="trip ${s}" data-trip="${t.id}">
      <div class="row"><span class="t">${esc(t.title)}</span><span class="chip ${s}">${chip}</span></div>
      <div class="d num">${md(t.firstDate)} – ${md(t.lastDate)}</div>
      <div class="meta"><span>移動 ${moves}件</span><span>宿泊 ${nights}泊</span>${(t.warnings||[]).length>0 && s!=="past"?`<span class="w">要確認 ${t.warnings.length}件</span>`:""}${first?`<span>${esc(first.dep.place)}発 ${esc(first.dep.time)}</span>`:""}</div>
      <span class="go">旅程を開く ›</span></button>`;
  }).join("") : `<div class="empty">この月の出張はありません</div>`;
}
function countdown(t){
  const mins = Math.ceil((t - now)/60000);
  if (mins < 60) return `あと${mins}分`;
  if (mins < 1440) return `あと${Math.floor(mins/60)}時間`;
  return `あと${Math.ceil(mins/1440)}日`;
}

/* ---------- 旅程画面 ---------- */
let openTrip = null, focusKey = null;
const coTime = it => `<span class="nw">${it.checkout.time ? esc(it.checkout.time) : "時刻記載なし"}</span>`;
const warnHTML = it => it.warn ? `<div class="warn">${esc(it.warn)}</div>` : "";
function factsHTML(f){ if(!f) return ""; return `<dl class="facts">${Object.entries(f).map(([k,v]) =>
  `<dt>${esc(k)}</dt><dd class="${/番号|座席|ID|乗り場/.test(k)?"num":""}">${esc(v)}</dd>`).join("")}</dl>`; }
function mapsHTML(it){
  if (it.type==="hotel") return `<a class="btn map" href="${mapURL(it.name+" "+it.address)}" target="_blank" rel="noopener">${PIN}地図で見る</a>`;
  return `<a class="btn map" href="${mapURL(it.dep.place)}" target="_blank" rel="noopener">${PIN}${esc(it.dep.place)}</a>`
       + `<a class="btn map" href="${mapURL(it.arr.place)}" target="_blank" rel="noopener">${PIN}${esc(it.arr.place)}</a>`;
}
function extraHTML(it){
  const b = [];
  if (it.ticketUrl) b.push(`<a class="btn ticket" href="${esc(it.ticketUrl)}" target="_blank" rel="noopener">QRチケットを表示</a>`);
  const rk = it.facts && Object.keys(it.facts).find(k => /予約|お預かり/.test(k));
  if (rk) b.push(`<button class="btn" data-copy="${esc(it.facts[rk])}">${esc(rk)}をコピー</button>`);
  if (it.address) b.push(`<button class="btn" data-copy="${esc(it.address)}">住所をコピー</button>`);
  if (it.tel) b.push(`<button class="btn" data-copy="${esc(it.tel)}">電話 <span class="num">${esc(it.tel)}</span></button>`);
  if (it.type!=="hotel") b.push(`<a class="btn" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(it.dep.place)}&destination=${encodeURIComponent(it.arr.place)}&travelmode=transit" target="_blank" rel="noopener">乗換経路</a>`);
  return b.join("");
}
function soonText(it){
  const s = st(it);
  if (s==="past") return "終了";
  if (it.type==="hotel") return s==="now" ? "滞在中" : (pulsing(it) ? "本日チェックイン" : "");
  if (s==="now") return "移動中";
  return pulsing(it) ? `出発まで${Math.ceil((it.start-now)/60000)}分` : "";
}
function cardHTML(it){
  const cls = it.type==="hotel" ? "stay" : "move", s = st(it), soon = soonText(it);
  const time = it.type==="hotel"
    ? `<div class="time">${esc(it.checkin)}<small>IN</small></div>`
    : `<div class="time">${esc(it.dep.time)}<small>→ ${esc(it.arr.time)}</small></div>`;
  const sub = it.type==="hotel"
    ? `<div class="sub">${esc(it.address)}</div><div class="sub">チェックアウト <span class="num nw">${md(it.checkout.date)}</span> ${coTime(it)}</div>${warnHTML(it)}`
    : `<div class="sub">${esc(it.dep.place)} → ${esc(it.arr.place)}</div>${warnHTML(it)}`;
  return `<article class="card ${cls} ${s}${pulsing(it)?" pulse":""}" data-key="${it.key}" tabindex="0" aria-label="${esc(it.name)}を拡大表示">
    ${time}<div class="main">
      <div class="tags"><span class="kind">${KIND[it.type]||"移動"}</span>${soon?`<span class="soon">${soon}</span>`:""}</div>
      <div class="title">${seg(it.name)}</div>${sub}
      <div class="actions">${mapsHTML(it)}</div></div></article>`;
}
function renderTrip(){
  const t = TRIPS.find(x => x.id===openTrip); if (!t) return;
  $("#trip-title").textContent = t.title;
  $("#trip-range").textContent = `${md(t.firstDate)} – ${md(t.lastDate)}`;
  const w = t.warnings || []; $("#trip-warn").hidden = !w.length;
  $("#trip-warn").innerHTML = w.length ? `<div class="label">要確認 ${w.length}件</div><ul>${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const byDay = {}; t.items.forEach(x => (byDay[x.date] ||= []).push(x));
  const d0 = at(t.firstDate);
  $("#days").innerHTML = Object.keys(byDay).sort().map(d =>
    `<h2>${Math.round((at(d)-d0)/DAY)+1}日目 <span class="num">${md(d)}</span></h2>${byDay[d].map(cardHTML).join("")}`).join("");
}
function renderSheet(){
  const sh = $("#sheet");
  if (!focusKey){ sh.hidden = true; sh.innerHTML = ""; return; }
  const it = byKey[focusKey], cls = it.type==="hotel" ? "stay" : "move", soon = soonText(it);
  const route = it.type==="hotel"
    ? `<div class="route"><div><div class="label">チェックイン ${md(it.date)}</div><div class="t num">${esc(it.checkin)}</div></div><div class="arrow">→</div>
       <div class="end"><div class="label">アウト ${md(it.checkout.date)}</div><div class="t num${it.checkout.time?"":" none"}">${it.checkout.time?esc(it.checkout.time):"記載なし"}</div></div></div>
       <div class="sub">${esc(it.address)}</div>`
    : `<div class="label">${md(it.date)}</div>
       <div class="route"><div><div class="t num">${esc(it.dep.time)}</div><div class="p">${seg(it.dep.place)}</div></div><div class="arrow">→</div>
       <div class="end"><div class="t num">${esc(it.arr.time)}</div><div class="p">${seg(it.arr.place)}</div></div></div>`;
  sh.innerHTML = `<div class="panel ${cls}" role="dialog" aria-modal="true" aria-label="${esc(it.name)}">
    <div class="bar"><span>${KIND[it.type]||"移動"}${soon?` ・ ${soon}`:""}</span><button class="close" data-close>閉じる</button></div>
    <div class="body"><div class="name">${seg(it.name)}</div>${route}${warnHTML(it)}${factsHTML(it.facts)}
      ${it.note?`<div class="sub">${esc(it.note)}</div>`:""}
      <div class="actions">${mapsHTML(it)}${extraHTML(it)}</div></div></div>`;
  sh.hidden = false;
}

/* ---------- 画面遷移（#トリップID で直接開ける） ---------- */
function route(){
  const id = location.hash.slice(1);
  openTrip = TRIPS.some(t => t.id===id) ? id : null;
  $("#view-dash").hidden = !!openTrip; $("#view-trip").hidden = !openTrip; $("#back").hidden = !openTrip;
  if (openTrip){ const t = TRIPS.find(x=>x.id===openTrip), j = jst(t.start); view.y = j.Y; view.m = j.M; renderTrip(); }
  else { focusKey = null; renderSheet(); renderYears(); renderDash(); }
  window.scrollTo(0,0);
}

/* ---------- 時計（毎秒）と状態の更新（毎分の境目） ---------- */
let lastMinute = -1;
function tick(){
  now = new Date();
  const j = jst(now);
  $("#clock").innerHTML = `<b>${p2(j.h)}:${p2(j.m)}:${p2(j.s)}</b><span>${j.M}/${j.D}（${j.w}）</span>`;
  if (j.m !== lastMinute){ lastMinute = j.m; openTrip ? renderTrip() : renderDash(); if (focusKey) renderSheet(); }
}

/* ---------- 操作 ---------- */
let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,1800); }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c){ const v = c.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(()=>toast(`コピーしました：${v}`)).catch(()=>{
      const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("選択しました。長押しでコピーしてください"); });
    return; }
  if (e.target.closest("a")) return;                      // 地図リンクは拡大せずにそのまま開く
  const mon = e.target.closest(".mon"); if (mon){ view.m = +mon.dataset.m; renderDash(); return; }
  const trip = e.target.closest("[data-trip]"); if (trip){ location.hash = trip.dataset.trip; return; }
  const card = e.target.closest(".card"); if (card){ focusKey = card.dataset.key; renderSheet(); return; }
  if (e.target.closest("[data-close]") || e.target.id==="sheet"){ focusKey = null; renderSheet(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && focusKey){ focusKey = null; renderSheet(); }
  if ((e.key==="Enter"||e.key===" ") && e.target.classList?.contains("card")){ e.preventDefault(); focusKey = e.target.dataset.key; renderSheet(); }
});
$("#year").addEventListener("change", e => { view.y = +e.target.value; renderDash(); });
$("#back").addEventListener("click", () => { location.hash = ""; });
addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ lastMinute = -1; tick(); } });

route(); tick(); setInterval(tick, 1000);
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
